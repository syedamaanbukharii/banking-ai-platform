# Alembic configuration. The database URL is supplied at runtime from the
# application settings (env.py), so no credentials live in this file.
[alembic]
script_location = migrations
prepend_sys_path = apps/backend
path_separator = os
# version_path_separator is os-dependent; keep migrations under versions/.
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
