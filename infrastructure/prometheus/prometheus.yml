# Prometheus scrape configuration for the Banking AI Platform.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: banking-ai-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: banking-ai-backend

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
