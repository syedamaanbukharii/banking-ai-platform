# Local development stack for the Banking AI Platform.
#
# Brings up the backend plus its production-shaped dependencies. The backend is
# runnable on its own (SQLite + in-memory adapters); this compose file wires the
# Postgres/Redis/MinIO/Keycloak/observability services for a closer-to-prod run.
#
# Usage:
#   cp .env.example .env   # then adjust as needed
#   docker compose up --build
#
# Note: secrets here are LOCAL DEV ONLY. Never reuse them outside local.

name: banking-ai

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: banking
      POSTGRES_DB: banking
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./infrastructure/keycloak:/opt/keycloak/data/import:ro

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+asyncpg://banking:banking@postgres:5432/banking
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENDPOINT_URL: http://minio:9000
      STORAGE_USE_LOCAL_FS: "false"
      SECURITY_AUTH_MODE: local
      LLM_ROUTER_POLICY: prefer_online
      METRICS_ENABLED: "true"
      # Provide GROQ_API_KEY in your .env to enable the online provider.
    env_file:
      - .env
    ports:
      - "8000:8000"
    # Run migrations, then serve.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn banking_ai.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    depends_on:
      - backend
    environment:
      WORKFLOW_BACKEND: inprocess  # set to 'temporal' with a Temporal cluster
      DATABASE_URL: postgresql+asyncpg://banking:banking@postgres:5432/banking
    env_file:
      - .env

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    ports:
      - "3001:3000"
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
  miniodata:
