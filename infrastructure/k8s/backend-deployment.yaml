apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-ai-backend
  namespace: banking-ai
  labels: { app: banking-ai-backend }
spec:
  replicas: 3
  selector:
    matchLabels: { app: banking-ai-backend }
  template:
    metadata:
      labels: { app: banking-ai-backend }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: backend
          image: ghcr.io/your-org/banking-ai-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: banking-ai-config }
            - secretRef: { name: banking-ai-secrets }
          readinessProbe:
            httpGet: { path: /api/v1/ready, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/v1/health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
