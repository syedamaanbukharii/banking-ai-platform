name: Release

# Builds and publishes images on a version tag, deploys to staging, then to
# production behind a manual approval gate (GitHub Environments).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
          - { name: backend, dockerfile: infrastructure/docker/Dockerfile.backend }
          - { name: worker, dockerfile: infrastructure/docker/Dockerfile.worker }
          - { name: frontend, dockerfile: infrastructure/docker/Dockerfile.frontend }
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.component.name }}
          tags: |
            type=semver,pattern={{version}}
            type=sha

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.component.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to staging
    needs: [build-and-push]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: |
          echo "Deploying ${{ github.ref_name }} to staging."
          # Wire up your deploy mechanism here (kubectl/helm/argocd).
          # Example:
          #   kubectl -n banking-ai set image deploy/banking-ai-backend \
          #     backend=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ github.ref_name }}
          #   kubectl -n banking-ai rollout status deploy/banking-ai-backend

  deploy-production:
    name: Deploy to production
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    # The 'production' environment is configured in GitHub with required
    # reviewers, which enforces a manual approval gate before this job runs.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: |
          echo "Deploying ${{ github.ref_name }} to production (post-approval)."
          # kubectl -n banking-ai set image deploy/banking-ai-backend \
          #   backend=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ github.ref_name }}
          # kubectl -n banking-ai rollout status deploy/banking-ai-backend
