[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "banking-ai-platform"
version = "0.1.0"
description = "Enterprise Agentic AI Platform for Banking Operations (backend)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Banking AI Platform Maintainers" }]

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.0",
    "pyjwt>=2.8",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "structlog>=24.1",
    "tenacity>=8.3",
    "redis>=5.0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
# Production object store / vector store / workflow drivers. Kept optional so the
# repo runs locally and in CI without heavyweight native deps.
storage = ["boto3>=1.34"]
workflow = ["temporalio>=1.6"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "black>=24.4",
    "mypy>=1.10",
    "bandit>=1.7",
    "types-passlib",
]

[project.scripts]
banking-ai = "banking_ai.main:run"

[tool.setuptools.packages.find]
where = ["apps/backend"]
include = ["banking_ai*"]

# ----------------------------------------------------------------------------
# Tooling configuration (single source of truth for code quality)
# ----------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["apps/backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "ASYNC", "RUF"]
ignore = [
    "B008", # FastAPI uses function calls (Depends/Query) in argument defaults by design
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
mypy_path = "apps/backend"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["tests.*", "migrations.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["apps/backend"]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["banking_ai"]
branch = true
omit = ["*/migrations/*", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Core, self-contained logic should stay well covered. Kept realistic for a
# foundation repo where some I/O adapters are exercised only via integration.
fail_under = 70

[tool.bandit]
exclude_dirs = ["tests", "migrations"]
# B101 assert_used is acceptable in non-test code paths guarded by config; we do
# not rely on asserts for security so it is excluded to reduce noise.
skips = ["B101"]
